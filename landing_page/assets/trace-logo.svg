<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="60%" stop-color="#00C7BE"/>
      <stop offset="100%" stop-color="#34C759"/>
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="50%" stop-color="#34C759"/>
      <stop offset="85%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34C759" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#34C759" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34C759" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#27272A" stroke-width="3"/>
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Ambient Radar Aura -->
  <circle cx="256" cy="256" r="210" fill="url(#centerAura)"/>

  <!-- Concentric Telemetry Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0,122,255,0.18)" stroke-width="2"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="rgba(52,199,89,0.25)" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="256" cy="256" r="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Crosshair Reticle -->
  <line x1="256" y1="46" x2="256" y2="100" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="466" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="46" y1="256" x2="100" y2="256" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="466" y2="256" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Telemetry Vector Path (Dynamic Hairpin Curve) -->
  <path d="M 110,380 C 140,320 170,390 220,330 C 270,270 190,190 256,150 C 310,115 370,160 402,230" 
        fill="none" stroke="url(#trackGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Compass Cardinal Ticks -->
  <circle cx="256" cy="66" r="3" fill="#007AFF"/>
  <circle cx="446" cy="256" r="3" fill="#007AFF"/>
  <circle cx="256" cy="446" r="3" fill="#007AFF"/>
  <circle cx="66" cy="256" r="3" fill="#007AFF"/>

  <!-- Pulsing Center Location Puck -->
  <circle cx="256" cy="256" r="48" fill="url(#beaconGlow)"/>
  <circle cx="256" cy="256" r="14" fill="#34C759" stroke="#FFFFFF" stroke-width="4" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="4" fill="#FFFFFF"/>

  <!-- Apex Indicator Point -->
  <circle cx="256" cy="150" r="9" fill="#FF9500" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
