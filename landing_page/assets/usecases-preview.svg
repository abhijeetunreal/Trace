<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1000" height="380" fill="#000000" rx="24"/>

  <!-- Card 1: Track Days & Motorsports -->
  <g transform="translate(24, 24)" filter="url(#cardGlow)">
    <rect width="220" height="332" rx="20" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="18" y="20" width="48" height="48" rx="14" fill="rgba(255, 59, 48, 0.15)"/>
    <!-- Racing Flag / Speedometer Icon -->
    <path d="M 34 32 L 50 32 L 44 42 L 50 52 L 34 52 Z M 34 32 L 34 56" fill="none" stroke="#FF3B30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="18" y="98" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Motorsports &amp;</text>
    <text x="18" y="118" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Track Days</text>
    
    <text x="18" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="18" dy="0">High-frequency 10Hz</tspan>
      <tspan x="18" dy="16">telemetry blackbox.</tspan>
      <tspan x="18" dy="16">Track cornering speed,</tspan>
      <tspan x="18" dy="16">apex deceleration, and</tspan>
      <tspan x="18" dy="16">circuit sector splits.</tspan>
    </text>

    <!-- Stat Pill -->
    <rect x="18" y="270" width="184" height="38" rx="10" fill="#27272A" fill-opacity="0.5"/>
    <text x="30" y="286" fill="#FF3B30" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">10Hz Sampling</text>
    <text x="30" y="300" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9.5">Sub-meter Haversine</text>
  </g>

  <!-- Card 2: Alpine Cycling & Mountain Climbs -->
  <g transform="translate(268, 24)" filter="url(#cardGlow)">
    <rect width="220" height="332" rx="20" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="18" y="20" width="48" height="48" rx="14" fill="rgba(0, 122, 255, 0.15)"/>
    <!-- Mountain & Gradient Icon -->
    <path d="M 28 54 L 42 34 L 54 54 Z M 42 34 L 52 46 L 60 54" fill="none" stroke="#007AFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="18" y="98" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Alpine Cycling &amp;</text>
    <text x="18" y="118" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Hill Climbs</text>
    
    <text x="18" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="18" dy="0">Instant elevation gain</tspan>
      <tspan x="18" dy="16">accumulation &amp; grade %.</tspan>
      <tspan x="18" dy="16">Interactive profile</tspan>
      <tspan x="18" dy="16">scrubber and direct</tspan>
      <tspan x="18" dy="16">Strava GPX 1.1 export.</tspan>
    </text>

    <!-- Stat Pill -->
    <rect x="18" y="270" width="184" height="38" rx="10" fill="#27272A" fill-opacity="0.5"/>
    <text x="30" y="286" fill="#007AFF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">+Grade &amp; Ele Gains</text>
    <text x="30" y="300" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9.5">GPX 1.1 with &lt;extensions&gt;</text>
  </g>

  <!-- Card 3: Road Trips & Overlanding -->
  <g transform="translate(512, 24)" filter="url(#cardGlow)">
    <rect width="220" height="332" rx="20" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="18" y="20" width="48" height="48" rx="14" fill="rgba(52, 199, 89, 0.15)"/>
    <!-- Compass / Shield Icon -->
    <circle cx="42" cy="44" r="14" fill="none" stroke="#34C759" stroke-width="2.5"/>
    <path d="M 42 36 L 46 44 L 42 52 L 38 44 Z" fill="#34C759"/>
    
    <text x="18" y="98" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Road Trips &amp;</text>
    <text x="18" y="118" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Overlanding</text>
    
    <text x="18" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="18" dy="0">100% offline blackbox.</tspan>
      <tspan x="18" dy="16">Logs continuous routes</tspan>
      <tspan x="18" dy="16">through tunnels, valleys,</tspan>
      <tspan x="18" dy="16">and cellular dead zones</tspan>
      <tspan x="18" dy="16">with screen-off wake locks.</tspan>
    </text>

    <!-- Stat Pill -->
    <rect x="18" y="270" width="184" height="38" rx="10" fill="#27272A" fill-opacity="0.5"/>
    <text x="30" y="286" fill="#34C759" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">100% Offline Core</text>
    <text x="30" y="300" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9.5">Audio &amp; Wake Sentinel</text>
  </g>

  <!-- Card 4: Field Surveying & GIS Mapping -->
  <g transform="translate(756, 24)" filter="url(#cardGlow)">
    <rect width="220" height="332" rx="20" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1.2"/>
    <rect x="18" y="20" width="48" height="48" rx="14" fill="rgba(245, 158, 11, 0.15)"/>
    <!-- Layers / Satellite Icon -->
    <polygon points="42,32 58,40 42,48 26,40" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
    <polygon points="42,42 58,50 42,58 26,50" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
    
    <text x="18" y="98" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">GIS Surveying &amp;</text>
    <text x="18" y="118" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Field Mapping</text>
    
    <text x="18" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="400">
      <tspan x="18" dy="0">Direct RFC 7946</tspan>
      <tspan x="18" dy="16">GeoJSON LineStrings</tspan>
      <tspan x="18" dy="16">and raw CSV tables.</tspan>
      <tspan x="18" dy="16">Zero cloud leaks,</tspan>
      <tspan x="18" dy="16">instant QGIS ready.</tspan>
    </text>

    <!-- Stat Pill -->
    <rect x="18" y="270" width="184" height="38" rx="10" fill="#27272A" fill-opacity="0.5"/>
    <text x="30" y="286" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GeoJSON &amp; CSV</text>
    <text x="30" y="300" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9.5">Local Private Storage</text>
  </g>
</svg>
