<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E12"/>
      <stop offset="60%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="70%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#007AFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="greenGlow" cx="85%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#34C759" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="50%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <filter id="shadowHeavy" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#007AFF" flood-opacity="0.3"/>
    </filter>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bgGrad2)"/>
  <rect width="1200" height="520" fill="url(#blueGlow)"/>
  <rect width="1200" height="520" fill="url(#greenGlow)"/>

  <!-- Subtle Grid Lines -->
  <path d="M 0,130 L 1200,130 M 0,260 L 1200,260 M 0,390 L 1200,390" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M 300,0 L 300,520 M 600,0 L 600,520 M 900,0 L 900,520" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)"/>

  <!-- ================= LEFT BRAND & HERO COPY ================= -->
  <g transform="translate(80, 75)">
    <!-- Brand Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <circle cx="16" cy="16" r="4.5" fill="#34C759" filter="url(#neon)"/>
      <text x="28" y="21" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">RUST CORE</text>
      <text x="104" y="21" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12">•</text>
      <text x="116" y="21" fill="#38BDF8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">10Hz GNSS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">TRACE</text>
    <text x="0" y="132" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.3">Precision Mobile GPS Telemetry Blackbox</text>

    <!-- Subtitle -->
    <text x="0" y="172" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">
      Military-grade geodesy, dynamic speed &amp; elevation gradient scrubbers,
    </text>
    <text x="0" y="196" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="15" font-weight="400">
      60fps vector map playback, and instant GPX / GeoJSON export.
    </text>
    <text x="0" y="224" fill="#34C759" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">
      🔒 Zero tracking. Zero cloud accounts. 100% offline-first.
    </text>

    <!-- Feature Pillars Bento -->
    <g transform="translate(0, 260)">
      <!-- Box 1: Geodesy -->
      <rect x="0" y="0" width="130" height="74" rx="16" fill="#18181B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="16" y="28" fill="#007AFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">±1.2m</text>
      <text x="16" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Accuracy</text>
      <text x="16" y="62" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">Haversine Geodesy</text>

      <!-- Box 2: Rate -->
      <rect x="142" y="0" width="130" height="74" rx="16" fill="#18181B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="158" y="28" fill="#34C759" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">10 Hz</text>
      <text x="158" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Sample Rate</text>
      <text x="158" y="62" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">Rust Engine</text>

      <!-- Box 3: Export -->
      <rect x="284" y="0" width="160" height="74" rx="16" fill="#18181B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="300" y="28" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="18" font-weight="800">GPX 1.1</text>
      <text x="300" y="48" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Universal Share</text>
      <text x="300" y="62" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10">WhatsApp / Strava</text>
    </g>

    <!-- Download Badge Link Hint -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="220" height="42" rx="14" fill="#007AFF" filter="url(#neon)"/>
      <text x="110" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">GitHub Releases &amp; APK →</text>
    </g>
  </g>

  <!-- ================= RIGHT SIDE MINI MOBILE SHOWCASE ================= -->
  <g transform="translate(730, 40)" filter="url(#shadowHeavy)">
    <!-- Mini Phone Frame -->
    <rect x="0" y="0" width="370" height="440" rx="42" fill="#121214" stroke="#2C2C2E" stroke-width="3"/>
    <rect x="4" y="4" width="362" height="432" rx="38" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Screen Content Preview -->
    <g transform="translate(18, 20)">
      <!-- Status Notch -->
      <rect x="110" y="2" width="114" height="20" rx="10" fill="#000000"/>
      <!-- Header -->
      <text x="10" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800">TRACE</text>
      <rect x="62" y="29" width="30" height="13" rx="3" fill="rgba(255,255,255,0.1)"/>
      <text x="77" y="39" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" text-anchor="middle">RUST</text>
      <rect x="254" y="27" width="70" height="18" rx="9" fill="rgba(52,199,89,0.15)"/>
      <text x="289" y="39" fill="#34C759" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" text-anchor="middle">LIVE GPS ±1.4m</text>

      <!-- Bento Box Top -->
      <rect x="0" y="52" width="334" height="90" rx="16" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="94" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="34" font-weight="800">68.2</text>
      <text x="88" y="80" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">KM/H</text>
      <text x="14" y="108" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9">Live Speed</text>

      <text x="320" y="92" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" text-anchor="end">24:18.0</text>
      <text x="320" y="108" fill="#71717A" font-family="-apple-system, sans-serif" font-size="9" text-anchor="end">Duration • 18.4 km</text>
      <line x1="14" y1="116" x2="320" y2="116" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="132" fill="#007AFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">+640 m Elev</text>
      <text x="170" y="132" fill="#34C759" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Avg 54.2 km/h</text>
      <text x="320" y="132" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="end">Max 89.1 km/h</text>

      <!-- Vector Map Box -->
      <g transform="translate(0, 150)">
        <rect x="0" y="0" width="334" height="160" rx="16" fill="#09090C" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <path d="M 0,40 Q 90,80 180,30 T 334,70" fill="none" stroke="#16161D" stroke-width="2"/>
        <path d="M 0,110 Q 120,70 240,140 T 334,120" fill="none" stroke="#16161D" stroke-width="2"/>
        <path d="M 30,130 C 60,110 90,140 130,120 C 170,100 140,60 190,50 C 240,40 270,70 305,40" 
              fill="none" stroke="url(#accentLine)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>
        <circle cx="190" cy="50" r="14" fill="#007AFF" fill-opacity="0.3"/>
        <circle cx="190" cy="50" r="6" fill="#007AFF" stroke="#FFFFFF" stroke-width="2"/>
      </g>

      <!-- Bottom Share Pills -->
      <g transform="translate(0, 320)">
        <rect x="0" y="0" width="334" height="64" rx="14" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="40" cy="32" r="14" fill="#25D366"/>
        <circle cx="110" cy="32" r="14" fill="#229ED9"/>
        <circle cx="180" cy="32" r="14" fill="#007AFF"/>
        <rect x="220" y="18" width="100" height="28" rx="8" fill="#5856D6"/>
        <text x="270" y="36" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Share Intent</text>
      </g>
    </g>
  </g>
</svg>
