<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 940" width="100%" height="100%">
  <defs>
    <!-- Chassis Outer & Bezel Shadows -->
    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#007AFF" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <linearGradient id="bodyBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0C0C0E"/>
    </linearGradient>

    <linearGradient id="screenGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070709"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Velocity Gradient Polyline -->
    <linearGradient id="speedTrackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="35%" stop-color="#00C7BE"/>
      <stop offset="65%" stop-color="#34C759"/>
      <stop offset="85%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FF3B30"/>
    </linearGradient>

    <!-- Elevation Sparkline Gradient Fill -->
    <linearGradient id="sparkFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ================= PHONE BODY & CHASSIS ================= -->
  <!-- Outer Shadow & Metallic Border -->
  <rect x="20" y="20" width="420" height="900" rx="56" fill="url(#bodyBezel)" stroke="#2C2C2E" stroke-width="3" filter="url(#phoneShadow)"/>
  <rect x="24" y="24" width="412" height="892" rx="52" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Inner Display Screen (OLED Pure Black) -->
  <rect x="30" y="30" width="400" height="880" rx="46" fill="url(#screenGlass)"/>

  <!-- ================= TOP STATUS BAR & DYNAMIC ISLAND ================= -->
  <!-- Solid Black Status Bar Shield -->
  <rect x="30" y="30" width="400" height="52" rx="46" fill="#000000"/>

  <!-- Dynamic Island -->
  <rect x="165" y="40" width="130" height="30" rx="15" fill="#000000" stroke="#1C1C1E" stroke-width="1"/>
  <!-- Front Camera Lens Reflection -->
  <circle cx="275" cy="55" r="5" fill="#0A0A10" stroke="#1A1A24" stroke-width="1"/>
  <circle cx="276" cy="54" r="1.5" fill="#1E3A8A"/>

  <!-- Status Bar Time -->
  <text x="66" y="60" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="-0.2">09:41</text>

  <!-- Status Bar Icons (Cellular, WiFi, Battery) -->
  <g transform="translate(345, 48)" fill="#FFFFFF">
    <!-- 4 Bars Cellular -->
    <rect x="0" y="8" width="3" height="4" rx="0.8"/>
    <rect x="4.5" y="6" width="3" height="6" rx="0.8"/>
    <rect x="9" y="3" width="3" height="9" rx="0.8"/>
    <rect x="13.5" y="0" width="3" height="12" rx="0.8"/>
    <!-- 5G Badge -->
    <text x="21" y="10" font-family="-apple-system, sans-serif" font-size="9" font-weight="700">5G</text>
    <!-- Battery Capsule -->
    <rect x="38" y="1" width="22" height="11" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
    <rect x="40" y="3" width="15" height="7" rx="1.8" fill="#34C759"/>
    <path d="M 61,4.5 L 61,8.5" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- ================= APP HEADER (STICKY) ================= -->
  <g transform="translate(48, 92)">
    <!-- Status Dot -->
    <circle cx="6" cy="14" r="4.5" fill="#34C759" filter="url(#glow)"/>
    <!-- App Title & Badges -->
    <text x="18" y="19" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.3">TRACE</text>
    <rect x="80" y="7" width="36" height="16" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="98" y="19" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">RUST</text>
    <!-- Keep-Alive Pill -->
    <rect x="122" y="7" width="68" height="16" rx="8" fill="rgba(52,199,89,0.15)"/>
    <text x="156" y="18.5" fill="#34C759" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">KEEP-ALIVE</text>

    <!-- Right Controls: GPS Pill & Theme Toggle -->
    <rect x="254" y="2" width="56" height="25" rx="12.5" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="282" y="18" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">GPS</text>

    <circle cx="334" cy="14.5" r="12.5" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <path d="M 338 12 A 5 5 0 1 1 332 9 A 4 4 0 0 0 338 12 Z" fill="#FBBF24"/>
  </g>

  <!-- ================= PRIMARY BENTO TELEMETRY CARD ================= -->
  <g transform="translate(48, 134)">
    <!-- Card Frame -->
    <rect x="0" y="0" width="364" height="175" rx="24" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Status & GPS Accuracy -->
    <text x="16" y="24" fill="#34C759" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">● Recording 10Hz GNSS</text>
    <text x="348" y="24" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" text-anchor="end">GPS ±1.6m</text>

    <!-- Hero Velocity Readout -->
    <text x="16" y="76" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">58.4</text>
    <text x="122" y="60" fill="#71717A" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">KM/H</text>
    <text x="16" y="93" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="500">Live Velocity</text>

    <!-- Duration Clock -->
    <text x="348" y="72" fill="#E4E4E7" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" text-anchor="end" letter-spacing="-0.5">18:42.5</text>
    <text x="348" y="93" fill="#71717A" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="end">Active Duration</text>

    <!-- 3-Pillar Telemetry Strip -->
    <line x1="16" y1="104" x2="348" y2="104" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

    <!-- Distance Pillar -->
    <rect x="16" y="112" width="102" height="46" rx="12" fill="#2C2C2E" fill-opacity="0.6"/>
    <text x="67" y="132" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">14.82 km</text>
    <text x="67" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Distance</text>

    <!-- Altitude Pillar -->
    <rect x="131" y="112" width="102" height="46" rx="12" fill="#2C2C2E" fill-opacity="0.6"/>
    <text x="182" y="132" fill="#007AFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">+482 m</text>
    <text x="182" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Elevation</text>

    <!-- Rust Points Pillar -->
    <rect x="246" y="112" width="102" height="46" rx="12" fill="#2C2C2E" fill-opacity="0.6"/>
    <text x="297" y="132" fill="#34C759" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1,428</text>
    <text x="297" y="148" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">Rust Pts</text>
  </g>

  <!-- ================= TACTILE STOP/RECORD ACTION BUTTON ================= -->
  <g transform="translate(48, 319)">
    <rect x="0" y="0" width="364" height="42" rx="14" fill="#FF3B30" filter="url(#glow)"/>
    <circle cx="132" cy="21" r="5" fill="#FFFFFF"/>
    <text x="150" y="26" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="-0.2">Stop Trace Recording</text>
  </g>

  <!-- ================= VECTOR MAP REPLAY CARD ================= -->
  <g transform="translate(48, 372)">
    <!-- Map Canvas Container -->
    <rect x="0" y="0" width="364" height="230" rx="22" fill="#121214" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Vector Map Grid & Topography Contour Lines -->
    <path d="M 0,40 Q 90,80 180,30 T 364,70" fill="none" stroke="#1E1E24" stroke-width="1.5"/>
    <path d="M 0,110 Q 120,70 240,140 T 364,120" fill="none" stroke="#1E1E24" stroke-width="1.5"/>
    <path d="M 0,170 Q 140,210 270,160 T 364,190" fill="none" stroke="#1E1E24" stroke-width="1.5"/>

    <!-- Map Tile Road Network Underlay -->
    <path d="M 40,230 L 70,180 L 140,170 L 190,130 L 220,130 L 290,70 L 330,0" fill="none" stroke="#25252D" stroke-width="4"/>
    <path d="M 0,140 L 90,120 L 160,140 L 240,60 L 320,50 L 364,70" fill="none" stroke="#25252D" stroke-width="3"/>

    <!-- High-Velocity Alpine Stelvio Track (Glowing Multi-Hue Polyline) -->
    <path d="M 50,205 
             C 80,180 90,215 130,195 
             C 170,175 140,130 190,120 
             C 240,110 210,75 250,55 
             C 290,35 320,65 335,45" 
          fill="none" stroke="url(#speedTrackGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Start Marker (Green) -->
    <circle cx="50" cy="205" r="5" fill="#34C759" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Pulsing Radar Puck Location -->
    <circle cx="190" cy="120" r="18" fill="#007AFF" fill-opacity="0.25"/>
    <circle cx="190" cy="120" r="8" fill="#007AFF" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)"/>
    <circle cx="190" cy="120" r="2.5" fill="#FFFFFF"/>

    <!-- Finish Marker (Red) -->
    <circle cx="335" cy="45" r="5" fill="#FF3B30" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Top Left Speed/Alt Toggle Pill -->
    <rect x="12" y="12" width="112" height="26" rx="8" fill="rgba(28,28,30,0.88)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="14" y="14" width="52" height="22" rx="6" fill="#007AFF"/>
    <text x="40" y="29" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Speed</text>
    <text x="94" y="29" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" text-anchor="middle">Altitude</text>

    <!-- Top Right Fit & Follow Controls -->
    <rect x="256" y="12" width="64" height="26" rx="8" fill="rgba(28,28,30,0.88)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="288" y="29" fill="#007AFF" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Follow ON</text>
    <rect x="326" y="12" width="26" height="26" rx="8" fill="rgba(28,28,30,0.88)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <path d="M 333,19 L 336,19 L 336,22 M 345,19 L 342,19 L 342,22 M 333,31 L 336,31 L 336,28 M 345,31 L 342,31 L 342,28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Floating Live Coordinates Bar -->
    <rect x="12" y="194" width="340" height="24" rx="8" fill="rgba(28,28,30,0.92)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="210" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">46.5286° N, 10.4531° E</text>
    <text x="340" y="210" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">09:41:18 UTC</text>
  </g>

  <!-- ================= SYNCHRONIZED SCRUBBER CARD ================= -->
  <g transform="translate(48, 612)">
    <rect x="0" y="0" width="364" height="110" rx="20" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Live Scrubber Metrics -->
    <text x="14" y="22" fill="#34C759" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">62.8 km/h</text>
    <text x="96" y="22" fill="#52525B">|</text>
    <text x="108" y="22" fill="#007AFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">2,148 m</text>
    <text x="174" y="22" fill="#52525B">|</text>
    <text x="186" y="22" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">+7.4% Grade</text>
    <text x="350" y="22" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="end">14.82 km</text>

    <!-- Sparkline Elevation Canvas -->
    <g transform="translate(14, 32)">
      <rect x="0" y="0" width="336" height="38" rx="8" fill="#09090B"/>
      <!-- Sparkline Area Fill -->
      <path d="M 0,32 Q 40,28 80,18 T 160,24 T 240,10 T 336,6 L 336,38 L 0,38 Z" fill="url(#sparkFill)"/>
      <!-- Velocity Curve -->
      <path d="M 0,32 Q 40,28 80,18 T 160,24 T 240,10 T 336,6" fill="none" stroke="#007AFF" stroke-width="2"/>
      <!-- Playhead Needle -->
      <line x1="180" y1="0" x2="180" y2="38" stroke="#34C759" stroke-width="1.5"/>
      <circle cx="180" cy="19" r="3.5" fill="#34C759" stroke="#FFFFFF" stroke-width="1.5"/>
    </g>

    <!-- Slider & Transport Controls -->
    <circle cx="28" cy="88" r="12" fill="#007AFF"/>
    <path d="M 26,83 L 33,88 L 26,93 Z" fill="#FFFFFF"/>
    <!-- Track Line -->
    <rect x="52" y="86" width="250" height="4" rx="2" fill="rgba(255,255,255,0.15)"/>
    <rect x="52" y="86" width="134" height="4" rx="2" fill="#007AFF"/>
    <!-- Scrubber Thumb -->
    <circle cx="186" cy="88" r="9" fill="#FFFFFF" filter="url(#glow)"/>
    <circle cx="186" cy="88" r="3" fill="#007AFF"/>
    <text x="350" y="92" fill="#71717A" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">684/1428</text>
  </g>

  <!-- ================= BOTTOM NATIVE SHARE ROW WITH OFFICIAL ICONS ================= -->
  <g transform="translate(48, 732)">
    <rect x="0" y="0" width="364" height="120" rx="22" fill="#1C1C1E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Format Pills (.GPX Track active) -->
    <rect x="12" y="10" width="340" height="28" rx="10" fill="#2C2C2E"/>
    <rect x="14" y="12" width="108" height="24" rx="8" fill="#FFFFFF"/>
    <text x="68" y="28" fill="#000000" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">.GPX Track</text>
    <text x="182" y="28" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">.GeoJSON</text>
    <text x="296" y="28" fill="#A1A1AA" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">.CSV Data</text>

    <!-- Quick Launchers with Official Logos -->
    <g transform="translate(18, 48)">
      <!-- WhatsApp (Official Green) -->
      <g transform="translate(0, 0)">
        <circle cx="32" cy="18" r="17" fill="#25D366"/>
        <path d="M 32 10 A 8 8 0 0 0 25 22 L 24 26 L 28 25 A 8 8 0 1 0 32 10 Z" fill="#FFFFFF"/>
        <text x="32" y="47" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">WhatsApp</text>
      </g>

      <!-- Telegram (Official Sky Blue) -->
      <g transform="translate(84, 0)">
        <circle cx="32" cy="18" r="17" fill="#229ED9"/>
        <path d="M 25 18 L 38 13 L 35 23 L 31 20 L 29 22 Z" fill="#FFFFFF"/>
        <text x="32" y="47" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Telegram</text>
      </g>

      <!-- Mail (Official Cupertino Blue) -->
      <g transform="translate(168, 0)">
        <circle cx="32" cy="18" r="17" fill="#007AFF"/>
        <rect x="23" y="12" width="18" height="12" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
        <path d="M 23 13 L 32 19 L 41 13" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
        <text x="32" y="47" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Mail</text>
      </g>

      <!-- Device Share Sheet / All Apps -->
      <g transform="translate(252, 0)">
        <circle cx="32" cy="18" r="17" fill="#5856D6"/>
        <circle cx="27" cy="18" r="2.5" fill="#FFFFFF"/>
        <circle cx="37" cy="13" r="2.5" fill="#FFFFFF"/>
        <circle cx="37" cy="23" r="2.5" fill="#FFFFFF"/>
        <line x1="27" y1="18" x2="37" y2="13" stroke="#FFFFFF" stroke-width="1.5"/>
        <line x1="27" y1="18" x2="37" y2="23" stroke="#FFFFFF" stroke-width="1.5"/>
        <text x="32" y="47" fill="#E4E4E7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">All Apps</text>
      </g>
    </g>
  </g>

  <!-- ================= HOME BAR INDICATOR ================= -->
  <rect x="160" y="894" width="140" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.3"/>
</svg>
