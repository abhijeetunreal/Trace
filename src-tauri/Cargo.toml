[package]
name = "trace-gps"
version = "1.0.0"
description = "TRACE — Precision Mobile GPS Telemetry Blackbox in Rust"
authors = ["Codefry"]
edition = "2021"
default-run = "trace-gps"

[lib]
name = "trace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trace-gps"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "fast-rng", "serde"] }
dirs = "5.0"
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
