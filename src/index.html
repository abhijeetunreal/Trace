<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TRACE — Precision GPS Telemetry</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet + OpenFreeMap (MapLibre GL Vector Tiles) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        ios: {
                            blue: '#007AFF',
                            green: '#34C759',
                            red: '#FF3B30',
                            orange: '#FF9500',
                            darkCard: '#1C1C1E',
                            darkElevated: '#2C2C2E',
                            lightBg: '#F2F2F7',
                            lightCard: '#FFFFFF',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-[#F2F2F7] dark:bg-black text-zinc-900 dark:text-white font-sans antialiased min-h-screen flex flex-col items-center transition-colors duration-300 selection:bg-ios-blue/20">

    <!-- Fixed Top Status Bar Shield - Solid obsidian black across BOTH dark and light themes (keeps clock & 5G/battery icons 100% visible) -->
    <div class="status-bar-shield"></div>

    <!-- Apple-Style Single-Column Mobile Shell with Safe Area Top/Bottom Insets -->
    <div class="app-container w-full max-w-md min-h-screen flex flex-col">

        <!-- Sticky Cupertino Navigation Header (Masks scrolled content underneath) -->
        <header class="sticky-header -mx-4 px-4 py-2.5 mb-3 bg-[#F2F2F7]/95 dark:bg-black/95 backdrop-blur-xl border-b border-black/[0.05] dark:border-white/[0.08] flex items-center justify-between transition-colors shadow-xs">
            <div class="flex items-center gap-2.5">
                <div class="w-2.5 h-2.5 rounded-full bg-ios-green shadow-[0_0_8px_#34C759]" id="statusDot"></div>
                <div class="flex items-baseline gap-1.5">
                    <span class="font-bold text-base tracking-tight">TRACE</span>
                    <span class="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded-sm bg-black/5 dark:bg-white/10 text-zinc-500 font-semibold">RUST</span>
                </div>
                <span id="wakeBadge" class="hidden items-center px-2 py-0.5 rounded-full bg-ios-green/15 text-ios-green text-[10px] font-semibold tracking-wide">
                    KEEP-ALIVE
                </span>
            </div>

            <div class="flex items-center gap-2">
                <!-- GPS vs Simulator Pill -->
                <button id="sourceToggleBtn" onclick="toggleSourceMode()" class="px-3 py-1.5 rounded-full bg-white dark:bg-ios-darkCard border border-black/5 dark:border-white/10 text-xs font-medium text-zinc-600 dark:text-zinc-300 shadow-sm active:scale-95 transition">
                    <span id="sourceLabel" class="text-zinc-900 dark:text-white font-semibold">GPS</span>
                </button>

                <!-- Apple Light/Dark Theme Switch -->
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-full bg-white dark:bg-ios-darkCard border border-black/5 dark:border-white/10 flex items-center justify-center text-zinc-700 dark:text-zinc-200 shadow-sm active:scale-90 transition" title="Toggle Appearance">
                    <svg id="themeIconSun" class="w-4 h-4 hidden dark:block text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden text-zinc-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- Primary Apple Fitness / Watch Ultra Inspired Telemetry Card -->
        <section class="bg-white dark:bg-ios-darkCard border border-black/[0.04] dark:border-white/[0.08] rounded-[28px] p-5 mb-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none transition-colors">
            <!-- Status & GPS Accuracy Row -->
            <div class="flex items-center justify-between text-xs font-medium text-zinc-400 dark:text-zinc-500 mb-3">
                <span id="hudStatusText">Ready to Record</span>
                <span id="hudAccuracy" class="tabular-nums">GPS ±--m</span>
            </div>

            <!-- Hero Readouts: Velocity & Duration -->
            <div class="flex items-baseline justify-between my-1">
                <div>
                    <div class="flex items-baseline gap-1.5">
                        <span id="liveSpeed" class="text-5xl font-bold tracking-tight tabular-nums text-zinc-900 dark:text-white">0.0</span>
                        <span class="text-xs font-semibold text-zinc-400 uppercase">km/h</span>
                    </div>
                    <span class="text-[11px] font-medium text-zinc-400 dark:text-zinc-500">Live Speed</span>
                </div>

                <div class="text-right">
                    <div id="liveTimer" class="text-3xl font-semibold tracking-tight tabular-nums text-zinc-800 dark:text-zinc-100">00:00.0</div>
                    <span class="text-[11px] font-medium text-zinc-400 dark:text-zinc-500">Duration</span>
                </div>
            </div>

            <!-- 3-Pillar Bento Telemetry Strip -->
            <div class="grid grid-cols-3 gap-2.5 pt-4 mt-4 border-t border-zinc-100 dark:border-white/[0.07] text-center">
                <div class="bg-[#F2F2F7]/80 dark:bg-ios-darkElevated/60 rounded-2xl py-2.5 px-2">
                    <div id="liveDist" class="text-sm font-semibold tabular-nums text-zinc-900 dark:text-white">0.00 km</div>
                    <div class="text-[10px] font-medium text-zinc-400 dark:text-zinc-500 mt-0.5">Distance</div>
                </div>
                <div class="bg-[#F2F2F7]/80 dark:bg-ios-darkElevated/60 rounded-2xl py-2.5 px-2">
                    <div id="liveAlt" class="text-sm font-semibold tabular-nums text-ios-blue">-- m</div>
                    <div class="text-[10px] font-medium text-zinc-400 dark:text-zinc-500 mt-0.5">Altitude</div>
                </div>
                <div class="bg-[#F2F2F7]/80 dark:bg-ios-darkElevated/60 rounded-2xl py-2.5 px-2">
                    <div id="livePts" class="text-sm font-semibold tabular-nums text-ios-green">0</div>
                    <div class="text-[10px] font-medium text-zinc-400 dark:text-zinc-500 mt-0.5">Rust Pts</div>
                </div>
            </div>

            <!-- Tactile Start/Stop Action Button -->
            <button id="masterRecordBtn" onclick="toggleRecording()" class="w-full mt-5 py-4 rounded-2xl font-semibold text-sm tracking-tight transition-all flex items-center justify-center gap-2.5 bg-ios-green text-white shadow-md shadow-ios-green/20 active:scale-[0.98]">
                <span id="recordDot" class="w-2.5 h-2.5 rounded-full bg-white"></span>
                <span id="recordBtnLabel">Start Trace</span>
            </button>
        </section>

        <!-- Recorded Traces List (Inline Expandable Apple Cards) -->
        <section class="flex-1 flex flex-col">
            <div class="flex items-center justify-between px-1 mb-2.5">
                <div class="flex items-center gap-2">
                    <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 dark:text-zinc-500">Recorded Traces</h2>
                    <span id="savedCount" class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-zinc-600 dark:text-zinc-300 tabular-nums">0</span>
                </div>
                <button onclick="generateDemoTrackAction()" class="text-xs font-medium text-ios-blue active:opacity-70 transition">
                    + Sample Route
                </button>
            </div>

            <!-- Accordion Container -->
            <div id="tracesAccordion" class="space-y-3">
                <!-- Populated dynamically -->
            </div>
        </section>

    </div>

    <!-- Universal Multi-Platform Share & Export Sheet (iOS Bottom Sheet) -->
    <div id="shareSheetBackdrop" onclick="closeShareSheet(event)" class="fixed inset-0 z-[900] bg-black/60 backdrop-blur-xs hidden items-end justify-center transition-opacity">
        <div onclick="event.stopPropagation()" class="w-full max-w-md bg-white dark:bg-[#1C1C1E] rounded-t-[32px] p-5 pb-8 border-t border-black/5 dark:border-white/10 shadow-2xl transform transition-transform">
            <!-- Grab Handle -->
            <div class="w-10 h-1.5 rounded-full bg-zinc-300 dark:bg-zinc-700 mx-auto mb-4"></div>

            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 id="shareSheetTitle" class="text-base font-semibold text-zinc-900 dark:text-white">Share Telemetry</h3>
                    <p id="shareSheetSubtitle" class="text-xs text-zinc-400 dark:text-zinc-500 mt-0.5">Precision Rust Telemetry Engine</p>
                </div>
                <button onclick="closeShareSheet()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-ios-darkElevated flex items-center justify-center text-zinc-500 hover:text-zinc-900 dark:hover:text-white transition">
                    ✕
                </button>
            </div>

            <!-- Format Selector Segmented Control -->
            <div class="grid grid-cols-3 gap-1.5 p-1 rounded-2xl bg-[#F2F2F7] dark:bg-ios-darkElevated mb-4 text-xs font-semibold">
                <button id="fmtBtn_gpx" onclick="selectShareFormat('gpx')" class="py-2 rounded-xl bg-white dark:bg-ios-darkCard text-zinc-900 dark:text-white shadow-xs transition">
                    .GPX Track
                </button>
                <button id="fmtBtn_geojson" onclick="selectShareFormat('geojson')" class="py-2 rounded-xl text-zinc-500 dark:text-zinc-400 transition">
                    .GeoJSON
                </button>
                <button id="fmtBtn_csv" onclick="selectShareFormat('csv')" class="py-2 rounded-xl text-zinc-500 dark:text-zinc-400 transition">
                    .CSV Data
                </button>
            </div>

            <!-- Primary Native System Sharesheet Action (Invokes Device App Chooser) -->
            <button onclick="triggerNativeFileShare()" class="w-full py-3.5 px-4 rounded-2xl bg-ios-blue hover:bg-blue-600 active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center gap-2.5 shadow-md shadow-ios-blue/25 transition-all mb-4">
                <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
                </svg>
                <span>Device Share Sheet (All Apps)</span>
            </button>

            <!-- Quick Direct App Launchers with Official Brand Logos -->
            <div class="grid grid-cols-4 gap-2.5 text-center mb-4">
                <!-- WhatsApp (Official Brand Green + Handset Logo) -->
                <button onclick="shareToPlatform('whatsapp')" class="flex flex-col items-center gap-1.5 p-2.5 rounded-2xl bg-[#F2F2F7] dark:bg-ios-darkElevated hover:bg-zinc-200 dark:hover:bg-zinc-700/60 active:scale-95 transition-all group">
                    <div class="w-11 h-11 rounded-full bg-[#25D366] text-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.05 20.15C10.57 20.15 9.12 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.8 7.37 7.5 3.67 12.05 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.15 12.05 20.15ZM16.57 14.33C16.32 14.2 15.1 13.61 14.88 13.52C14.65 13.44 14.49 13.4 14.32 13.65C14.16 13.89 13.69 14.45 13.54 14.61C13.4 14.77 13.25 14.8 13 14.67C12.75 14.55 11.95 14.29 11 13.44C10.26 12.78 9.76 11.97 9.62 11.72C9.47 11.47 9.6 11.34 9.73 11.22C9.84 11.11 9.98 10.93 10.1 10.79C10.23 10.65 10.27 10.54 10.35 10.38C10.43 10.21 10.39 10.07 10.33 9.95C10.27 9.83 9.77 8.6 9.57 8.09C9.37 7.59 9.16 7.66 9.01 7.65H8.53C8.36 7.65 8.09 7.71 7.86 7.96C7.64 8.21 7 8.81 7 10.02C7 11.23 7.88 12.4 8.01 12.56C8.13 12.72 9.75 15.22 12.23 16.29C12.82 16.55 13.28 16.7 13.64 16.82C14.23 17.01 14.77 16.98 15.2 16.92C15.68 16.85 16.67 16.32 16.88 15.74C17.08 15.17 17.08 14.68 17.02 14.58C16.96 14.47 16.82 14.45 16.57 14.33Z"/>
                        </svg>
                    </div>
                    <span class="text-[11px] font-medium text-zinc-700 dark:text-zinc-300">WhatsApp</span>
                </button>

                <!-- Telegram (Official Sky Blue + Paper Plane Logo) -->
                <button onclick="shareToPlatform('telegram')" class="flex flex-col items-center gap-1.5 p-2.5 rounded-2xl bg-[#F2F2F7] dark:bg-ios-darkElevated hover:bg-zinc-200 dark:hover:bg-zinc-700/60 active:scale-95 transition-all group">
                    <div class="w-11 h-11 rounded-full bg-[#229ED9] text-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/>
                        </svg>
                    </div>
                    <span class="text-[11px] font-medium text-zinc-700 dark:text-zinc-300">Telegram</span>
                </button>

                <!-- Mail / Email (Official Cupertino Blue + Envelope) -->
                <button onclick="shareToPlatform('email')" class="flex flex-col items-center gap-1.5 p-2.5 rounded-2xl bg-[#F2F2F7] dark:bg-ios-darkElevated hover:bg-zinc-200 dark:hover:bg-zinc-700/60 active:scale-95 transition-all group">
                    <div class="w-11 h-11 rounded-full bg-ios-blue text-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <span class="text-[11px] font-medium text-zinc-700 dark:text-zinc-300">Mail</span>
                </button>

                <!-- Copy Summary (Zinc / Dark Slate + Clipboard Icon) -->
                <button onclick="shareToPlatform('copy')" class="flex flex-col items-center gap-1.5 p-2.5 rounded-2xl bg-[#F2F2F7] dark:bg-ios-darkElevated hover:bg-zinc-200 dark:hover:bg-zinc-700/60 active:scale-95 transition-all group">
                    <div class="w-11 h-11 rounded-full bg-zinc-700 dark:bg-zinc-600 text-white flex items-center justify-center shadow-sm group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/>
                        </svg>
                    </div>
                    <span class="text-[11px] font-medium text-zinc-700 dark:text-zinc-300">Copy</span>
                </button>
            </div>

            <!-- Direct Device Download Button -->
            <button onclick="downloadSelectedFormat()" class="w-full py-3.5 rounded-2xl bg-[#F2F2F7] dark:bg-ios-darkElevated hover:bg-zinc-200 dark:hover:bg-zinc-700/60 text-zinc-800 dark:text-zinc-200 font-semibold text-xs flex items-center justify-center gap-2 active:scale-[0.98] transition">
                <svg class="w-4 h-4 text-zinc-600 dark:text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                <span>Save File Directly to Device</span>
            </button>
        </div>
    </div>

    <!-- Minimal Cupertino Pill Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[1000] transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-zinc-900/90 dark:bg-white/95 backdrop-blur-md text-white dark:text-zinc-900 px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 text-xs font-semibold whitespace-nowrap">
            <span class="w-2 h-2 rounded-full bg-ios-green"></span>
            <span id="toastMsg">Ready</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
