name: Build Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - 'landing_page/**'
      - 'README.md'
      - 'assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux GUI & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "build-tools;36.0.0" "platforms;android-36" "platforms;android-35" "platforms;android-34"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Determine Release Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE_VERSION=$(node -p "require('./package.json').version")
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --verbose

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "src-tauri/gen/android/gradlew" ]; then
            chmod +x src-tauri/gen/android/gradlew
          fi

      - name: Initialize Android Project (if missing)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init
            chmod +x src-tauri/gen/android/gradlew
          fi

      - name: Build Android APK via Tauri
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          npx @tauri-apps/cli android build --apk

      - name: Package & Sign Android APKs
        id: package_apks
        run: |
          mkdir -p release-artifacts

          # Find Android SDK Build Tools (zipalign & apksigner)
          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android Build Tools from: $BUILD_TOOLS_DIR"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          # Generate signing keystore for production-ready installable APKs
          keytool -genkeypair -v -keystore release.keystore -alias trace-release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass tracepassword -keypass tracepassword \
            -dname "CN=Trace, OU=Mobile, O=Codefry, C=US"

          # Function to align, sign with v1+v2+v3, and verify
          sign_and_package() {
            local src_apk="$1"
            local dest_name="$2"

            if [ -f "$src_apk" ]; then
              echo "==> Aligning and signing: $src_apk -> $dest_name"
              "$ZIPALIGN" -p -f 4 "$src_apk" /tmp/aligned.apk
              "$APKSIGNER" sign --ks release.keystore \
                --ks-pass pass:tracepassword \
                --key-pass pass:tracepassword \
                --ks-key-alias trace-release \
                --v1-signing-enabled true \
                --v2-signing-enabled true \
                --v3-signing-enabled true \
                --out "release-artifacts/$dest_name" /tmp/aligned.apk

              # Verify signature scheme v1, v2, v3
              echo "Verified signature for $dest_name:"
              "$APKSIGNER" verify --verbose "release-artifacts/$dest_name"
              rm -f /tmp/aligned.apk
            else
              echo "Warning: Source APK $src_apk not found."
            fi
          }

          # 1. Sign Universal APK (contains native libs for all architectures)
          UNIVERSAL_SRC=$(find src-tauri/gen/android -name "*universal*.apk" -type f | head -n 1)
          if [ -n "$UNIVERSAL_SRC" ]; then
            sign_and_package "$UNIVERSAL_SRC" "trace-v${{ env.VERSION }}-universal.apk"
            cp "release-artifacts/trace-v${{ env.VERSION }}-universal.apk" "release-artifacts/trace-universal.apk"
          fi

          # 2. Sign ARM64 APK
          ARM64_SRC=$(find src-tauri/gen/android -name "*arm64*.apk" -type f | head -n 1)
          if [ -n "$ARM64_SRC" ]; then
            sign_and_package "$ARM64_SRC" "trace-v${{ env.VERSION }}-arm64-v8a.apk"
          fi

          # 3. Sign ARMv7 (32-bit) APK
          ARM_SRC=$(find src-tauri/gen/android -name "*arm-*.apk" -o -name "*armeabi*.apk" -type f | head -n 1)
          if [ -n "$ARM_SRC" ]; then
            sign_and_package "$ARM_SRC" "trace-v${{ env.VERSION }}-armeabi-v7a.apk"
          fi

          # Fallback if universal wasn't found by pattern
          if [ ! -f "release-artifacts/trace-universal.apk" ]; then
            FIRST_SRC=$(find src-tauri/gen/android -name "*.apk" -type f | head -n 1)
            if [ -n "$FIRST_SRC" ]; then
              sign_and_package "$FIRST_SRC" "trace-v${{ env.VERSION }}-universal.apk"
              cp "release-artifacts/trace-v${{ env.VERSION }}-universal.apk" "release-artifacts/trace-universal.apk"
            fi
          fi

          # Generate SHA256 Checksums
          cd release-artifacts
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Update Landing Page with Release Download URL
        run: |
          python3 -c "
          import re
          version = '${{ env.VERSION }}'
          repo = '${{ github.repository }}'
          download_url = f'https://github.com/{repo}/releases/download/v{version}/trace-v{version}-universal.apk'

          with open('landing_page/index.html', 'r', encoding='utf-8') as f:
              content = f.read()

          content = re.sub(r'https://github\.com/[^/\"\'\s]+/[^/\"\'\s]+/releases/(?:latest/download|download)/[^\"\'\s]+', download_url, content)
          content = re.sub(r'Trace v[0-9a-zA-Z.\-]+', f'Trace v{version}', content)
          content = re.sub(r'trace-v[0-9a-zA-Z.\-]*-universal\.apk', f'trace-v{version}-universal.apk', content)

          with open('landing_page/index.html', 'w', encoding='utf-8') as f:
              f.write(content)
          print(f'Successfully updated landing_page/index.html for {repo} v{version}')
          "

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << EOF > RELEASE_NOTES.md
          # 🛰️ TRACE — Precision Mobile GPS Telemetry Blackbox v${{ env.VERSION }}

          High-precision, offline-first GPS telemetry blackbox and vector route visualizer built with **Rust 2021** and **Tauri v2 Mobile**.

          ### 📦 Direct Downloads
          - 📱 **[Download Universal APK (All Android Devices)](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/trace-v${{ env.VERSION }}-universal.apk)**
          - ⚡ **[Download Canonical APK](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/trace-universal.apk)**
          - 🔒 **[SHA256 Checksums](https://github.com/${{ github.repository }}/releases/download/v${{ env.VERSION }}/SHA256SUMS.txt)**

          ### ✨ Key Features
          - **Pure Rust Telemetry Engine**: Sub-meter haversine geodesy, velocity smoothing, and elevation gradient calculation.
          - **OpenFreeMap Vector Tiles**: High-performance offline and online vector map playback with Apple dark/light styling.
          - **Tactile Telemetry Scrubber**: Dynamic elevation and speed sparkline synchronized with a high-contrast location beacon.
          - **Military/Alpine Grade Exporter**: One-tap export to **.GPX 1.1**, **.GeoJSON**, and **.CSV**.
          - **Screen-Off Keep-Alive**: AudioContext oscillator and WakeLock API prevent OS throttling during telemetry logging.
          - **100% Private & On-Device**: Zero tracking, zero ads, zero external server dependencies.

          ### 📲 Android Installation Instructions
          1. Tap **trace-v${{ env.VERSION }}-universal.apk** above to download.
          2. Open the downloaded file from your notifications or Files app.
          3. Tap **Settings** and allow **Install unknown apps** if prompted.
          4. Open Trace and grant **Location** permission to start recording!
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Trace GPS Telemetry v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          files: |
            release-artifacts/*.apk
            release-artifacts/SHA256SUMS.txt

      - name: Commit Updated Landing Page to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add landing_page/index.html
          git diff-index --quiet HEAD || git commit -m "chore(release): update landing page for v${{ env.VERSION }} [skip ci]"
          git push origin HEAD || echo "Push skipped or branch protected"

      - name: Deploy Landing Page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing_page
          force_orphan: true
